name: G02 Self-Hosted Runner Sentinel

on:
  push:
    branches:
      - studio/promotion-and-playable-surfaces
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel:
    name: G02 Runner Sentinel
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    steps:
      - name: Sentinel start
        shell: bash
        run: |
          set -euo pipefail
          echo "G02_SENTINEL=START"
          echo "RUNNER_ID=${RUNNER_ID}"
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "GITHUB_SHA=${GITHUB_SHA}"

      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Telemetry correlation sentinel
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME}"
          test "${RUNNER_ID}" -gt 0
          test -n "${GITHUB_RUN_ID}"
          test -n "${GITHUB_SHA}"
          printf '%s
'             "G02_EVIDENCE_VERSION=1"             "G02_STATE=EXECUTING"             "RUNNER_ID=${RUNNER_ID}"             "RUNNER_NAME=${RUNNER_NAME}"             "RUN_ID=${GITHUB_RUN_ID}"             "COMMIT_SHA=${GITHUB_SHA}"             "JOB_NAME=${GITHUB_JOB}"             "WORKFLOW=${GITHUB_WORKFLOW}"             "CORRELATION_KEY=${GITHUB_RUN_ID}:${GITHUB_SHA}:${RUNNER_ID}"             > g02-evidence.txt
          cat g02-evidence.txt

      - name: Upload sentinel evidence
        uses: actions/upload-artifact@v4
        with:
          name: g02-sentinel-evidence
          path: g02-evidence.txt
          if-no-files-found: error

      - name: Sentinel complete
        shell: bash
        run: |
          set -euo pipefail
          echo "G02_SENTINEL=PASS"
          echo "G02_ACCEPTANCE_REQUIRES_INDEPENDENT_VERIFICATION=true"
